<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarea - Catálogo de Películas por Ver</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; background: #f4f6f7; color: #2c3e50; }
    .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    input { padding: 10px; font-size: 14px; flex: 1; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1f618d; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; background: #ecf0f1; margin-bottom: 10px; padding: 12px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    li:hover { background: #d5dbdb; }
    li.vista { text-decoration: line-through; color: #7f8c8d; background: #eaeded; }
    .btn-borrar { background: #c0392b; padding: 6px 10px; font-size: 12px; }
    .btn-borrar:hover { background: #962d22; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mis Películas por Ver</h1>
    <form id="formPelicula">
      <input type="text" id="inputTitulo" placeholder="Título de la película..." required>
      <input type="text" id="inputGenero" placeholder="Género..." required>
      <button type="submit">Agregar</button>
    </form>
    <ul id="listaPeliculas"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
